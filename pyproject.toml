[project]
name = "tomas-jax"
version = "0.1.0"
description = "High-performance, differentiable aerosol microphysics in JAX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "diffrax>=0.6.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ipython>=8.0",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tomas_jax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
